<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>運動節奏計時器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Noto+Sans+TC:wght@500;700;900&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<div class="app" id="app" data-phase="ready" data-playing="false">

  <div class="fab-cluster">
    <button class="fab" id="historyBtn" aria-label="歷史紀錄">
      <svg viewBox="0 0 24 24"><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><path d="M3.5 12a8.5 8.5 0 1 0 2.2-5.7M3.5 4v3h3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span class="ftxt">歷史</span>
    </button>
    <button class="fab" id="libraryBtn" aria-label="共享清單">
      <svg viewBox="0 0 24 24"><path d="M4 5h10M4 10h10M4 15h7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"></path><path d="M18 8l3 3-3 3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span class="ftxt">共享清單</span>
    </button>
    <button class="fab" id="settingsBtn" aria-label="設定">
      <svg viewBox="0 0 24 24"><path d="M3 7h11M3 12h7M3 17h13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"></path><circle cx="17" cy="7" r="2.5"></circle><circle cx="13" cy="12" r="2.5"></circle><circle cx="19" cy="17" r="2.5"></circle></svg>
      <span class="ftxt">設定</span>
    </button>
  </div>

  <main class="stage">
    <div class="video">
      <div id="player"></div>
      <div class="poster"><div class="ptxt">YOUTUBE 影片</div></div>
      <button class="start-overlay" id="startBtn" aria-label="開始">
        <span class="big"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
        <span class="lbl">開始訓練</span>
        <span class="sub"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>將提供聲音提示，可放遠處用聽的</span>
      </button>
      <div class="progress-wrap">
        <div class="progress-head">
          <span class="lab">訓練總進度</span>
          <span class="time" id="elapsed">00:00 / 00:00</span>
        </div>
        <div class="progress-track" id="progressTrack">
          <div class="progress" id="progress" role="slider" aria-label="訓練進度"></div>
          <div class="progress-thumb" id="progressThumb"></div>
        </div>
      </div>
    </div>

    <section class="timer">
      <div class="phase-row">
        <span class="phase-label" id="phaseLabel">準備</span>
        <span class="rep" id="rep">準備開始</span>
      </div>

      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
          <circle class="track" cx="100" cy="100" r="86"></circle>
          <circle class="prog"  cx="100" cy="100" r="86" id="ringProg"></circle>
        </svg>
        <div class="count-box">
          <div class="count"><span id="count">--</span><span class="unit">秒</span></div>
          <div class="next" id="next"><span class="dot"></span>接下來：運動</div>
        </div>
      </div>

      <div class="controls">
        <button class="play" id="playBtn" aria-label="播放或暫停">
          <svg class="play-i" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg class="pause-i" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button class="chip" id="beepBtn" data-on="true" aria-label="切換提示音">
          <svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
          <span class="on-txt">提示音 開</span><span class="off-txt">提示音 關</span>
        </button>
      </div>
    </section>
  </main>

  <div class="drawer-backdrop" id="drawerBg" hidden></div>

  <aside class="drawer left" id="libDrawer" aria-hidden="true" aria-label="共享清單">
    <div class="drawer-head">
      <h2>共享清單</h2>
      <button class="x" id="libClose" aria-label="關閉">✕</button>
    </div>
    <div class="drawer-body">
      <p class="lib-intro">選一個別人分享的訓練計時，點一下即可載入開練。</p>
      <div class="lib-list" id="libList"></div>
      <section class="dsec" style="margin-top:8px;">
        <h3>加入共享清單</h3>
        <div class="field" style="margin-bottom:8px;">
          <input id="authorInput" type="text" placeholder="你的暱稱（選填）">
        </div>
        <button id="publishBtn" class="publishbtn">＋ 把目前計時加入清單</button>
        <p class="hint">加入後其他人也能看到並載入。</p>
      </section>
    </div>
  </aside>

  <aside class="drawer left" id="histDrawer" aria-hidden="true" aria-label="歷史紀錄">
    <div class="drawer-head">
      <h2>歷史紀錄</h2>
      <button class="x" id="histClose" aria-label="關閉">✕</button>
    </div>
    <div class="drawer-body">
      <p class="lib-intro">你看過的訓練計時，最近的在最上面。點一下即可重新載入。</p>
      <div class="lib-list" id="histList"></div>
      <section class="dsec" style="margin-top:8px;">
        <button id="clearHistBtn" class="copybtn ghost">清除歷史紀錄</button>
      </section>
    </div>
  </aside>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="設定">
    <div class="drawer-head">
      <h2>設定</h2>
      <button class="x" id="drawerClose" aria-label="關閉">✕</button>
    </div>
    <div class="drawer-body">
      <section class="dsec">
        <h3>影片來源</h3>
        <div class="field">
          <input id="urlInput" type="text" placeholder="貼上 YouTube 連結或影片 ID">
          <button id="loadBtn">載入</button>
        </div>
        <p class="hint">目前影片 ID：<span id="curVid"></span></p>
      </section>

      <section class="dsec">
        <h3>提示音量<span class="vlevel" id="vlevel">6 / 10</span></h3>
        <div class="field vol">
          <button class="iconbtn" id="volDown" aria-label="降低音量">－</button>
          <input id="volRange" type="range" min="0" max="10" step="1" value="6">
          <button class="iconbtn" id="volUp" aria-label="提高音量">＋</button>
        </div>
        <p class="hint">最後 3 秒倒數嗶聲與動作切換提示音的音量</p>
      </section>

      <section class="dsec">
        <div class="dsec-head">
          <h3>時間點<span class="cnt" id="tCount">0</span></h3>
          <button id="addNow" class="addbtn">＋ 加入目前時間</button>
        </div>
        <div class="tlist" id="tlist"></div>
        <p class="hint">奇數點開始「運動」、偶數點開始「休息」。播放到想標記處按「加入目前時間」即可。</p>
      </section>

      <section class="dsec">
        <button id="copyLink" class="copybtn">複製分享連結</button>
        <button id="resetBtn" class="copybtn ghost">還原為預設影片與時間點</button>
      </section>
    </div>
  </aside>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="storage.js?v=2"></script>
<script src="config.js?v=1"></script>
<script src="app.js?v=5"></script>
</body>
</html>
