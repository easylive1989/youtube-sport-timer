<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>運動節奏計時器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Noto+Sans+TC:wght@500;700;900&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:        oklch(0.16 0.012 60);
  --bg-2:      oklch(0.205 0.014 62);
  --surface:   oklch(0.235 0.015 64);
  --surface-2: oklch(0.285 0.016 66);
  --line:      oklch(0.34 0.018 66);
  --text:      oklch(0.97 0.006 80);
  --muted:     oklch(0.72 0.012 72);
  --faint:     oklch(0.55 0.012 72);

  --c-work:    oklch(0.70 0.185 42);
  --c-rest:    oklch(0.74 0.115 205);
  --c-ready:   oklch(0.84 0.155 92);
  --c-done:    oklch(0.76 0.16 152);

  --phase: var(--c-ready);
  --phase-soft: color-mix(in oklab, var(--phase) 16%, var(--bg));

  --r-lg: 22px;
  --r-md: 14px;
  --r-sm: 10px;

  --ff-display: "Teko", "Noto Sans TC", sans-serif;
  --ff-tc: "Noto Sans TC", "Archivo", sans-serif;
  --ff-ui: "Archivo", "Noto Sans TC", sans-serif;
}

*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--ff-ui);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

.app{
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(120% 80% at 50% -10%, var(--phase-soft), transparent 60%),
    var(--bg);
  transition:background .5s ease;
}

/* ---------- Floating controls ---------- */
.fab-cluster{
  position:fixed; top:14px; right:14px; z-index:30;
  display:flex; gap:8px;
}
.fab{
  appearance:none; cursor:pointer; display:flex; align-items:center; gap:8px;
  background:color-mix(in oklab, var(--bg) 72%, transparent);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  border:1px solid var(--line); color:var(--muted);
  border-radius:999px; padding:10px 16px;
  font-family:var(--ff-ui); font-weight:700; font-size:13px; transition:.16s ease;
}
.fab:hover{ color:var(--text); border-color:var(--faint); background:var(--surface); }
.fab svg{ width:18px; height:18px; fill:none; }
@media (max-width:560px){ .fab .ftxt{ display:none; } .fab{ padding:11px; } }

/* ---------- Stage (shared elements, CSS-driven layouts) ---------- */
.stage{
  flex:1 1 auto; min-height:0;
  display:grid;
  gap:clamp(14px,2.4vw,26px);
  padding:clamp(64px,9vh,82px) clamp(14px,2.6vw,30px) clamp(14px,2.6vw,30px);
  align-content:safe center;
  overflow-y:auto;
}

/* video */
.video{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  border-radius:var(--r-lg);
  overflow:hidden;
  border:1px solid var(--line);
  box-shadow:0 18px 50px -24px rgba(0,0,0,.8);
}
.video iframe, .video #player{ position:absolute; inset:0; width:100%; height:100%; border:0; }
.poster{ position:absolute; inset:0; display:grid; place-items:center; background:
  repeating-linear-gradient(135deg, #0d0d0e, #0d0d0e 12px, #131314 12px, #131314 24px); }
.poster .ptxt{ font-family:var(--ff-ui); font-size:12px; letter-spacing:2px; color:var(--faint); text-transform:uppercase; }

.start-overlay{
  position:absolute; inset:0; z-index:5;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  background:color-mix(in oklab, var(--bg) 60%, transparent);
  backdrop-filter:blur(3px);
  border:0; cursor:pointer; color:var(--text);
  font-family:var(--ff-ui);
  transition:opacity .3s ease;
}
.start-overlay .big{
  width:84px; height:84px; border-radius:50%;
  background:var(--phase); display:grid; place-items:center;
  box-shadow:0 0 0 10px color-mix(in oklab, var(--phase) 22%, transparent);
}
.start-overlay .big svg{ width:34px; height:34px; margin-left:5px; fill:var(--bg); }
.start-overlay .lbl{ font-weight:800; font-size:20px; }
.start-overlay .sub{ font-size:13px; color:var(--muted); display:flex; align-items:center; gap:7px; }
.start-overlay.hidden{ opacity:0; pointer-events:none; }

/* timer panel */
.timer{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:clamp(12px,1.8vw,20px);
  min-width:0;
}
.phase-row{ display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; justify-content:center; }
.phase-label{
  font-family:var(--ff-tc); font-weight:900;
  font-size:clamp(1.7rem,4.6vw,3rem); line-height:1;
  letter-spacing:.12em;
  color:var(--phase);
  transition:color .4s ease;
}
.rep{
  font-family:var(--ff-ui); font-weight:700; font-size:14px;
  color:var(--muted);
  padding:5px 13px; border-radius:999px;
  background:var(--surface); border:1px solid var(--line);
  white-space:nowrap;
}
.rep b{ color:var(--text); font-family:var(--ff-display); font-size:19px; font-weight:600; }

.ring-wrap{ position:relative; display:grid; place-items:center; width:min(70vmin,440px); aspect-ratio:1; }
.ring{ width:100%; height:100%; transform:rotate(-90deg); }
.ring .track{ fill:none; stroke:var(--surface-2); stroke-width:11; }
.ring .prog{
  fill:none; stroke:var(--phase); stroke-width:11; stroke-linecap:round;
}
.count-box{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
.count{
  font-family:var(--ff-display); font-weight:600;
  font-size:clamp(5rem,22vmin,15rem); line-height:.82;
  letter-spacing:.01em;
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum";
  color:var(--text);
}
.count .unit{ font-size:.26em; color:var(--muted); margin-left:.12em; letter-spacing:.05em; }
.next{
  font-family:var(--ff-ui); font-weight:700; font-size:13px;
  color:var(--muted); letter-spacing:.4px;
  display:flex; align-items:center; gap:8px;
}
.next .dot{ width:7px; height:7px; border-radius:50%; background:var(--phase); transition:background .4s ease; }

/* controls */
.controls{ display:flex; align-items:center; gap:14px; }
.play{
  appearance:none; border:0; cursor:pointer;
  width:74px; height:74px; border-radius:50%;
  background:var(--phase); color:var(--bg);
  display:grid; place-items:center;
  box-shadow:0 12px 30px -10px color-mix(in oklab, var(--phase) 60%, black);
  transition:transform .12s ease, background .4s ease;
}
.play:hover{ transform:scale(1.05); }
.play:active{ transform:scale(.96); }
.play svg{ width:30px; height:30px; fill:var(--bg); }
.play .pause-i{ display:none; }
.app[data-playing="true"] .play .play-i{ display:none; }
.app[data-playing="true"] .play .pause-i{ display:block; }

.chip{
  appearance:none; cursor:pointer;
  font-family:var(--ff-ui); font-weight:700; font-size:13px;
  color:var(--muted);
  background:var(--surface); border:1px solid var(--line);
  border-radius:999px; padding:10px 15px;
  display:flex; align-items:center; gap:8px;
  transition:.16s ease;
}
.chip:hover{ color:var(--text); border-color:var(--faint); }
.chip svg{ width:16px; height:16px; fill:currentColor; }
.chip[data-on="false"]{ opacity:.6; }
.chip[data-on="false"] .on-txt{ display:none; }
.chip[data-on="true"] .off-txt{ display:none; }
.chip[data-on="true"]{ color:var(--phase); border-color:color-mix(in oklab,var(--phase) 40%,var(--line)); }

/* progress — overlaid on video bottom */
.progress-wrap{
  position:absolute; left:0; right:0; bottom:0; z-index:4;
  padding:0 0 6px;
  background:linear-gradient(to top, rgba(0,0,0,.72) 0%, transparent 100%);
  border-radius:0 0 var(--r-lg) var(--r-lg);
}
.progress-head{
  display:flex; justify-content:space-between; align-items:center;
  padding:8px 14px 6px;
}
.progress-head .lab{ font-size:11px; font-weight:700; color:rgba(255,255,255,.55); letter-spacing:.5px; }
.progress-head .time{ font-family:var(--ff-display); font-size:16px; font-weight:600; color:rgba(255,255,255,.75); font-variant-numeric:tabular-nums; }
/* thick scrub track — 20px bar + 12px padding above = 32px total hit area */
.progress-track{
  padding:12px 14px 0;
  cursor:pointer;
  touch-action:none;
  user-select:none;
}
.progress{
  display:flex; gap:2px; height:20px; width:100%;
  border-radius:6px; overflow:hidden;
  background:rgba(255,255,255,.12);
  pointer-events:none;
}
.pseg{ position:relative; height:100%; overflow:hidden; }
.pseg.work{ background:color-mix(in oklab, var(--c-work) 28%, rgba(255,255,255,.08)); }
.pseg.rest{ background:color-mix(in oklab, var(--c-rest) 28%, rgba(255,255,255,.08)); }
.pseg .fill{ position:absolute; inset:0; width:0%; }
.pseg.work .fill{ background:var(--c-work); }
.pseg.rest .fill{ background:var(--c-rest); }
/* scrubber thumb */
.progress-thumb{
  position:absolute; bottom:6px; width:4px; background:white; border-radius:3px;
  height:20px; transform:translateX(-50%);
  pointer-events:none; box-shadow:0 0 6px rgba(0,0,0,.6);
  display:none;
}
.progress-track:hover .progress-thumb,
.progress-track.dragging .progress-thumb{ display:block; }

/* ===== Layout A — 專注 ===== */
.app[data-layout="A"] .stage{
  grid-template-columns:minmax(0,1fr);
  grid-template-areas:"video" "timer";
  max-width:760px; margin:0 auto; width:100%;
}
.app[data-layout="A"] .video{ grid-area:video; height:min(40vh,54vw); width:auto; max-width:100%; margin-inline:auto; }
.app[data-layout="A"] .ring-wrap{ width:min(36vh,68vmin); }
.app[data-layout="A"] .timer{ grid-area:timer; }

/* ===== Layout B — 儀表板 ===== */
.app[data-layout="B"] .stage{
  grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);
  grid-template-areas:"video timer";
  align-content:center;
  max-width:1280px; margin:0 auto; width:100%;
}
.app[data-layout="B"] .video{ grid-area:video; align-self:center; max-height:72vh; }
.app[data-layout="B"] .timer{
  grid-area:timer;
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-lg); padding:clamp(18px,2.4vw,32px);
  align-self:stretch; justify-content:center;
}
.app[data-layout="B"] .ring-wrap{ width:min(34vmin,260px); }
.app[data-layout="B"] .count{ font-size:clamp(3.4rem,13vmin,7rem); }

/* ===== Layout C — 沉浸 ===== */
.app[data-layout="C"]{
  background:
    radial-gradient(130% 90% at 50% 0%, color-mix(in oklab, var(--phase) 34%, var(--bg)), var(--bg) 72%);
}
.app[data-layout="C"] .stage{
  grid-template-columns:minmax(0,1fr);
  grid-template-areas:"video" "timer";
  max-width:880px; margin:0 auto; width:100%;
  gap:clamp(18px,3vw,34px);
}
.app[data-layout="C"] .video{ grid-area:video; height:min(40vh,70vw); width:auto; max-width:560px; margin:0 auto; }
.app[data-layout="C"] .timer{ grid-area:timer; gap:6px; }
.app[data-layout="C"] .ring{ display:none; }
.app[data-layout="C"] .ring-wrap{ width:auto; aspect-ratio:auto; }
.app[data-layout="C"] .count-box{ position:static; }
.app[data-layout="C"] .count{
  font-size:clamp(7rem,40vmin,24rem);
  text-shadow:0 8px 60px color-mix(in oklab, var(--phase) 50%, transparent);
}
.app[data-layout="C"] .rep, .app[data-layout="C"] .next{ display:none; }
.app[data-layout="C"] .phase-label{ font-size:clamp(2rem,6vw,3.4rem); }

/* phase pulse */
.app.pulse .stage{ animation:pulse .5s ease; }
@keyframes pulse{ 0%{ filter:brightness(1); } 35%{ filter:brightness(1.5); } 100%{ filter:brightness(1); } }
@media (prefers-reduced-motion:reduce){ .app.pulse .stage{ animation:none; } }

/* ---------- Responsive ---------- */
@media (max-width:880px){
  body{ overflow:auto; }
  .app{ height:auto; min-height:100dvh; }
  .app[data-layout="B"] .stage{
    grid-template-columns:minmax(0,1fr);
    grid-template-areas:"video" "timer";
    max-width:640px;
  }
  .app[data-layout="B"] .ring-wrap{ width:min(64vmin,360px); }
  .app[data-layout="B"] .count{ font-size:clamp(4.5rem,20vmin,11rem); }
  .stage{ align-content:start; }
}
@media (max-width:420px){
  .brand .name{ font-size:14px; }
  .play{ width:64px; height:64px; }
  .count .unit{ font-size:.22em; }
}

/* ---------- settings drawer ---------- */

.drawer-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:40; }
.drawer{
  position:fixed; top:0; right:0; height:100dvh; width:min(440px,94vw); z-index:50;
  background:var(--bg-2); border-left:1px solid var(--line);
  transform:translateX(100%);
  display:flex; flex-direction:column; box-shadow:-40px 0 80px -40px rgba(0,0,0,.8);
}
.drawer.open{ transform:translateX(0); }
.drawer-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--line); flex:0 0 auto; }
.drawer-head h2{ font-size:18px; font-weight:800; }
.drawer-head .x{ appearance:none; cursor:pointer; background:var(--surface); border:1px solid var(--line); color:var(--muted); width:36px; height:36px; border-radius:10px; font-size:14px; }
.drawer-head .x:hover{ color:var(--text); }
.drawer-body{ padding:20px 22px 48px; overflow-y:auto; display:flex; flex-direction:column; gap:28px; }
.dsec h3{ font-size:12px; font-weight:800; letter-spacing:.6px; color:var(--muted); margin-bottom:12px; display:flex; align-items:center; gap:10px; }
.dsec-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
.dsec-head h3{ margin-bottom:0; }
.field{ display:flex; gap:8px; }
.field input[type=text]{ flex:1; min-width:0; background:var(--surface); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:12px 13px; font-family:var(--ff-ui); font-size:14px; }
.field input::placeholder{ color:var(--faint); }
.field input:focus{ outline:none; border-color:var(--phase); }
.field>button{ appearance:none; cursor:pointer; background:var(--text); color:var(--bg); border:0; border-radius:10px; padding:0 18px; font-weight:800; font-size:14px; flex:0 0 auto; }
.hint{ font-size:12px; color:var(--faint); margin-top:9px; line-height:1.5; }
.hint span{ color:var(--muted); font-family:var(--ff-display); font-size:15px; }
.vlevel,.cnt{ margin-left:auto; font-family:var(--ff-display); font-size:18px; font-weight:600; color:var(--text); letter-spacing:.04em; }
.vol{ align-items:center; }
.iconbtn{ appearance:none; cursor:pointer; width:40px; height:40px; flex:0 0 auto; border-radius:10px; background:var(--surface); border:1px solid var(--line); color:var(--text); font-size:17px; font-weight:700; }
.iconbtn:hover{ border-color:var(--faint); }
input[type=range]{ flex:1; accent-color:var(--phase); height:6px; cursor:pointer; }
.addbtn{ appearance:none; cursor:pointer; background:color-mix(in oklab,var(--phase) 18%, var(--surface)); border:1px solid color-mix(in oklab,var(--phase) 40%,var(--line)); color:var(--phase); border-radius:999px; padding:9px 15px; font-weight:700; font-size:13px; white-space:nowrap; }
.addbtn:hover{ background:color-mix(in oklab,var(--phase) 26%, var(--surface)); }
.tlist{ display:flex; flex-direction:column; gap:7px; max-height:42vh; overflow-y:auto; }
.trow{ display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:9px 12px; }
.trow .ti{ font-family:var(--ff-display); font-size:13px; color:var(--faint); width:24px; text-align:center; }
.trow .tt{ font-family:var(--ff-display); font-size:20px; font-weight:600; color:var(--text); font-variant-numeric:tabular-nums; min-width:64px; }
.trow .tag{ font-size:11px; font-weight:800; padding:3px 10px; border-radius:999px; letter-spacing:.5px; }
.trow .tag.work{ background:color-mix(in oklab,var(--c-work) 22%, var(--bg)); color:var(--c-work); }
.trow .tag.rest{ background:color-mix(in oklab,var(--c-rest) 22%, var(--bg)); color:var(--c-rest); }
.trow .del{ margin-left:auto; appearance:none; cursor:pointer; width:30px; height:30px; border-radius:8px; background:transparent; border:1px solid var(--line); color:var(--muted); font-size:12px; flex:0 0 auto; }
.trow .del:hover{ color:oklch(0.7 0.18 25); border-color:oklch(0.5 0.12 25); }
.copybtn{ appearance:none; cursor:pointer; width:100%; background:var(--text); color:var(--bg); border:0; border-radius:11px; padding:13px; font-weight:800; font-size:14px; margin-bottom:10px; font-family:var(--ff-ui); }
.copybtn.ghost{ background:transparent; color:var(--muted); border:1px solid var(--line); }
.copybtn.ghost:hover{ color:var(--text); border-color:var(--faint); }

/* ---------- library (shared timers) drawer ---------- */
.drawer.left{ right:auto; left:0; border-left:0; border-right:1px solid var(--line); transform:translateX(-100%); box-shadow:40px 0 80px -40px rgba(0,0,0,.8); }
.lib-intro{ font-size:13px; color:var(--muted); line-height:1.6; margin-bottom:4px; }
.lib-list{ display:flex; flex-direction:column; gap:12px; }
.lib-group-label{ font-size:11px; font-weight:800; letter-spacing:.6px; color:var(--faint); margin:14px 0 2px; text-transform:uppercase; }
.card{
  display:flex; gap:13px; align-items:stretch;
  background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:11px; cursor:pointer; transition:.16s ease; text-align:left;
  width:100%; appearance:none; color:inherit; font-family:inherit;
}
.card:hover{ border-color:var(--phase); background:var(--surface-2); }
.card .thumb{
  position:relative; flex:0 0 96px; width:96px; aspect-ratio:16/10;
  border-radius:9px; overflow:hidden; background:var(--bg-2);
}
.card .thumb img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.card .thumb .ph{ position:absolute; inset:0; display:grid; place-items:center; background:
  linear-gradient(135deg, color-mix(in oklab,var(--c-work) 50%, var(--bg)), color-mix(in oklab,var(--c-rest) 50%, var(--bg))); }
.card .thumb .ph svg{ width:26px; height:26px; fill:rgba(255,255,255,.8); }
.card .thumb .dur{ position:absolute; right:5px; bottom:5px; font-family:var(--ff-display); font-size:13px; font-weight:600; line-height:1; color:#fff; background:rgba(0,0,0,.66); padding:3px 6px; border-radius:5px; }
.card .meta{ flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:5px; }
.card .meta .ttl{ font-weight:800; font-size:14px; line-height:1.25; color:var(--text); }
.card .meta .by{ font-size:12px; color:var(--muted); display:flex; align-items:center; gap:7px; }
.card .meta .by .av{ width:18px; height:18px; border-radius:50%; flex:0 0 auto; display:grid; place-items:center; font-size:10px; font-weight:800; color:var(--bg); }
.card .meta .stats{ display:flex; gap:6px; flex-wrap:wrap; }
.card .meta .pill{ font-size:11px; font-weight:700; color:var(--muted); background:var(--bg-2); border:1px solid var(--line); border-radius:999px; padding:2px 9px; white-space:nowrap; }
.card .meta .pill b{ color:var(--text); font-family:var(--ff-display); font-size:13px; font-weight:600; }
.card.active{ border-color:var(--phase); box-shadow:0 0 0 1px var(--phase) inset; }
.card .del2{ align-self:center; appearance:none; cursor:pointer; flex:0 0 auto; width:28px; height:28px; border-radius:7px; background:transparent; border:1px solid var(--line); color:var(--muted); font-size:11px; }
.card .del2:hover{ color:oklch(0.7 0.18 25); border-color:oklch(0.5 0.12 25); }
.lib-empty{ font-size:12px; color:var(--faint); padding:10px 0; }
.publishbtn{ appearance:none; cursor:pointer; width:100%; background:color-mix(in oklab,var(--phase) 18%, var(--surface)); border:1px solid color-mix(in oklab,var(--phase) 40%,var(--line)); color:var(--phase); border-radius:11px; padding:13px; font-weight:800; font-size:14px; font-family:var(--ff-ui); }
.publishbtn:hover{ background:color-mix(in oklab,var(--phase) 26%, var(--surface)); }
</style>
</head>
<body>
<div class="app" id="app" data-layout="A" data-phase="ready" data-playing="false">

  <div class="fab-cluster">
    <button class="fab" id="historyBtn" aria-label="歷史紀錄">
      <svg viewBox="0 0 24 24"><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><path d="M3.5 12a8.5 8.5 0 1 0 2.2-5.7M3.5 4v3h3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span class="ftxt">歷史</span>
    </button>

<script>
(function(){
  "use strict";

  /* ---------- config / params ---------- */
  var DEFAULT_VIDEO = "LmrKejHOaG4";
  var DEFAULT_TS = [40.49,85.09,100.59,145.56,160.59,205.56,220.59,265.56,280.59,325.56,
    340.59,385.56,400.59,445.56,460.59,505.56,520.59,565.56,580.59,625.56,640.59,685.56,
    700.59,745.56,760.59,805.56,820.59,865.56,880.59,925.56,940.59,985.56,1000.59,1045.56,
    1060.59,1105.56,1120.59,1165.56,1180.59,1225.56,1240.59];

  var params = new URLSearchParams(location.search);
  function ls(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

  var urlV = params.get("v"), urlT = params.get("t");
  var VIDEO = (urlV && urlV.trim()) ? urlV.trim() : (ls("yst-video") || DEFAULT_VIDEO);
  var TS = null;
  if (urlT && urlT.indexOf(",") !== -1){
    var a = urlT.split(",").map(function(s){return parseFloat(s);}).filter(function(x){return isFinite(x);});
    if (a.length >= 2) TS = a;
  }
  if (!TS){ try{ var lst = JSON.parse(ls("yst-timers")||"null"); if (Array.isArray(lst) && lst.length >= 2) TS = lst; }catch(e){} }
  if (!TS) TS = DEFAULT_TS.slice();

  var level = 6; var _lv = parseInt(ls("yst-vol"),10); if (!isNaN(_lv) && _lv>=0 && _lv<=10) level = _lv;
  var masterVol = level/10;

  var phases = [], W = 0, TOTAL_WORK = 0, T_START = 0, T_END = 0;

  /* ---------- elements ---------- */
  var app = document.getElementById("app");
  var elPhase = document.getElementById("phaseLabel");
  var elRep   = document.getElementById("rep");
  var elCount = document.getElementById("count");
  var elNext  = document.getElementById("next");
  var elRing  = document.getElementById("ringProg");
  var elElapsed = document.getElementById("elapsed");
  var elProgress = document.getElementById("progress");
  var elProgressTrack = document.getElementById("progressTrack");
  var elProgressThumb = document.getElementById("progressThumb");
  var startBtn = document.getElementById("startBtn");
  var playBtn  = document.getElementById("playBtn");
  var beepBtn  = document.getElementById("beepBtn");

  var RING_C = 2 * Math.PI * 86;
  elRing.style.strokeDasharray = RING_C.toFixed(1);
  elRing.style.strokeDashoffset = RING_C.toFixed(1);

  /* segmented progress bar + phase rebuild */
  var segEls = [];
  function buildProgress(){
    elProgress.innerHTML = "";
    segEls = [];
    var span = (T_END - T_START) || 1;
    for (var k=1; k<TS.length; k++){
      var d = TS[k]-TS[k-1];
      var isWork = ((k-1)%2===0);
      var seg = document.createElement("div");
      seg.className = "pseg " + (isWork?"work":"rest");
      seg.style.flex = (d/span).toFixed(4) + " 1 0";
      var fill = document.createElement("div");
      fill.className = "fill";
      seg.appendChild(fill);
      elProgress.appendChild(seg);
      segEls.push({el:seg, fill:fill, start:TS[k-1], end:TS[k]});
    }
  }
  function rebuild(){
    TS = TS.filter(function(x){return isFinite(x) && x>=0;}).sort(function(a,b){return a-b;});
    phases = []; W = 0;
    if (TS.length>0){
      phases.push({type:"ready", start:0, end:TS[0], workNo:0});
      for (var i=1; i<TS.length; i++){
        var isWork = ((i-1)%2===0); if (isWork) W++;
        phases.push({type:isWork?"work":"rest", start:TS[i-1], end:TS[i], workNo:W});
      }
    }
    TOTAL_WORK = W;
    T_START = TS.length ? TS[0] : 0;
    T_END = TS.length ? TS[TS.length-1] : 0;
    buildProgress();
    renderTimers();
    prevIdx = -99; lastBeepR = -1;
    var cv = document.getElementById("curVid"); if (cv) cv.textContent = VIDEO;
    var tc = document.getElementById("tCount"); if (tc) tc.textContent = TS.length;
  }

  /* ---------- audio ---------- */
  var actx = null, beepOn = true;
  function ensureAudio(){
    if (!actx){
      try { actx = new (window.AudioContext||window.webkitAudioContext)(); }
      catch(e){ return; }
    }
    if (actx.state === "suspended") actx.resume();
  }
  function tone(freq, dur, when, type, gainVal){
    if (!actx || !beepOn || masterVol<=0) return;
    var t0 = actx.currentTime + (when||0);
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type||"sine"; o.frequency.value = freq;
    o.connect(g); g.connect(actx.destination);
    var peak = Math.max(0.0002, (gainVal||0.18) * masterVol);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.start(t0); o.stop(t0+dur+0.03);
  }
  function beepCount(){ tone(880,0.12,0,"square",0.16); }                 // 3-2-1
  function cueWork(){ tone(1318,0.16,0,"sawtooth",0.20); tone(1760,0.20,0.14,"sawtooth",0.18); } // bright rising
  function cueRest(){ tone(523,0.40,0,"sine",0.18); }                     // mellow low
  function cueDone(){ [659,880,1175,1568].forEach(function(f,i){ tone(f,0.24,i*0.16,"triangle",0.17); }); }

  /* ---------- youtube player ---------- */
  var player=null, playerReady=false, playerOk=false;
  window.onYouTubeIframeAPIReady = function(){
    try{
      player = new YT.Player("player", {
        videoId: VIDEO,
        playerVars:{ controls:0, modestbranding:1, rel:0, playsinline:1, iv_load_policy:3, fs:0, disablekb:1 },
        events:{
          onReady:function(){ playerReady=true; playerOk=true; if (restoreTime>1){ try{ player.seekTo(restoreTime,true); player.pauseVideo(); }catch(e){} } },
          onError:function(){ playerOk=false; },
          onStateChange:function(e){
            if (e.data === YT.PlayerState.PLAYING){ setPlaying(true,true); }
            else if (e.data === YT.PlayerState.PAUSED){ setPlaying(false,true); }
            else if (e.data === YT.PlayerState.ENDED){ setPlaying(false,true); }
          }
        }
      });
    }catch(e){ playerOk=false; }
  };
  (function loadYT(){
    var s=document.createElement("script"); s.src="https://www.youtube.com/iframe_api";
    s.onerror=function(){ playerOk=false; };
    document.head.appendChild(s);
  })();

  /* ---------- engine state ---------- */
  var clock = 0, playing = false, started = false;
  var prevIdx = -99, lastBeepR = -1;
  var lastSave = 0;
  var restoreTime = 0;

  function usingPlayer(){ return playerReady && playerOk && player && typeof player.getCurrentTime === "function"; }

  function findPhase(t){
    if (t >= T_END) return {idx: phases.length, done:true};
    if (t < TS[0])  return {idx:0, phase:phases[0], done:false};
    // segments live at phases[1..]
    for (var k=1; k<phases.length; k++){
      if (t < phases[k].end) return {idx:k, phase:phases[k], done:false};
    }
    return {idx:phases.length, done:true};
  }

  var PH_TEXT = { ready:"準備", work:"運動", rest:"休息", done:"完成" };
  var PH_LIT = { ready:"oklch(0.84 0.155 92)", work:"oklch(0.70 0.185 42)", rest:"oklch(0.74 0.115 205)", done:"oklch(0.76 0.16 152)" };

  function setPlaying(v, fromPlayer){
    playing = v;
    app.setAttribute("data-playing", v?"true":"false");
    if (!fromPlayer && usingPlayer()){
      if (v) { try{ player.playVideo(); }catch(e){} }
      else   { try{ player.pauseVideo(); }catch(e){} }
    }
  }

  function start(){
    started = true;
    ensureAudio();
    startBtn.classList.add("hidden");
    startBtn.style.display = "none";
    setPlaying(true,false);
  }

  function setPhaseTheme(type){
    var cur = app.getAttribute("data-phase");
    if (cur !== type){
      app.setAttribute("data-phase", type);
      document.documentElement.style.setProperty("--phase", PH_LIT[type]);
    }
  }

  function fmt(s){
    s = Math.max(0, Math.floor(s));
    var m = Math.floor(s/60), ss = s%60;
    return (m<10?"0":"")+m+":"+(ss<10?"0":"")+ss;
  }

  function pulse(){
    app.classList.remove("pulse"); void app.offsetWidth; app.classList.add("pulse");
  }

  function update(t){
    var r = findPhase(t);
    var idx = r.idx;
    var type, timeLeft, dur, ph;

    if (r.done){
      type = "done"; timeLeft = 0; dur = 1;
    } else {
      ph = r.phase; type = ph.type;
      timeLeft = Math.max(0, ph.end - t);
      dur = ph.end - ph.start || 1;
    }

    setPhaseTheme(type);

    // phase change -> cue + pulse
    if (idx !== prevIdx){
      if (prevIdx !== -99 && started){
        if (type === "work") cueWork();
        else if (type === "rest") cueRest();
        else if (type === "done") cueDone();
        pulse();
      }
      prevIdx = idx;
      lastBeepR = -1;
    }

    // countdown beeps (last 3s of any timed phase, incl. 準備)
    if (!r.done){
      var rc = Math.ceil(timeLeft - 1e-6);
      if (rc !== lastBeepR && rc >= 1 && rc <= 3 && started){
        beepCount();
        lastBeepR = rc;
      } else if (rc > 3){
        lastBeepR = rc;
      }
    }

    // text
    elPhase.textContent = PH_TEXT[type];
    if (r.done){
      elCount.textContent = "✓";
      elRep.textContent = "全部完成 · " + TOTAL_WORK + " 組";
      elNext.innerHTML = '<span class="dot"></span>做得好！';
    } else {
      elCount.textContent = Math.ceil(timeLeft - 1e-6);
      if (type === "ready"){
        elRep.textContent = "準備開始 · 共 " + TOTAL_WORK + " 組";
        elNext.innerHTML = '<span class="dot"></span>接下來：運動';
      } else if (type === "work"){
        elRep.innerHTML = "第 <b>" + ph.workNo + "</b> / " + TOTAL_WORK + " 組";
        elNext.innerHTML = '<span class="dot"></span>' + (ph.workNo>=TOTAL_WORK ? "接下來：完成" : "接下來：休息");
      } else { // rest
        elRep.innerHTML = "休息中 · 下一組 <b>" + Math.min(ph.workNo+1, TOTAL_WORK) + "</b>";
        elNext.innerHTML = '<span class="dot"></span>接下來：運動';
      }
    }

    // ring (remaining fraction)
    var frac = r.done ? 0 : Math.max(0, Math.min(1, timeLeft / dur));
    elRing.style.strokeDashoffset = (RING_C * (1 - frac)).toFixed(1);

    // progress segments
    for (var i=0; i<segEls.length; i++){
      var s = segEls[i], p;
      if (t >= s.end) p = 100;
      else if (t <= s.start) p = 0;
      else p = ((t - s.start)/(s.end - s.start))*100;
      s.fill.style.width = p.toFixed(2) + "%";
    }

    // elapsed label (within workout region)
    var shown = Math.max(0, Math.min(t, T_END) - 0);
    elElapsed.textContent = fmt(Math.min(t, T_END)) + " / " + fmt(T_END);

    // persist
    if (t - lastSave > 1 || lastSave - t > 1){
      lastSave = t;
      try{ localStorage.setItem("yst-time", String(t)); }catch(e){}
    }
  }

  /* ---------- raf loop ---------- */
  var lastNow = performance.now();
  function frame(now){
    var dt = (now - lastNow)/1000; lastNow = now;
    if (dt > 0.5) dt = 0;
    if (usingPlayer()){
      try{ clock = player.getCurrentTime() || clock; }catch(e){}
    } else if (playing){
      clock += dt;
      if (clock >= T_END) { clock = T_END; setPlaying(false,false); }
    }
    update(clock);
    updateThumb(clock);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- interactions ---------- */
  startBtn.addEventListener("click", start);
  playBtn.addEventListener("click", function(){
    ensureAudio();
    if (!started){ start(); return; }
    setPlaying(!playing, false);
  });

  beepBtn.addEventListener("click", function(){
    beepOn = !beepOn;
    beepBtn.setAttribute("data-on", beepOn?"true":"false");
    try{ localStorage.setItem("yst-beep", beepOn?"1":"0"); }catch(e){}
    if (beepOn){ ensureAudio(); tone(880,0.1,0,"square",0.14); }
  });

  // auto layout by viewport size
  function pickLayout(){
    var w = window.innerWidth, h = window.innerHeight;
    var landscape = w >= h;
    var L;
    if (w >= 960 && landscape) L = "B";      // roomy landscape → dashboard
    else if (w <= 560) L = "C";              // phone → immersive big numbers
    else L = "A";                            // tablet / medium → focus
    if (app.getAttribute("data-layout") !== L) app.setAttribute("data-layout", L);
  }
  pickLayout();
  var _rzT = null;
  window.addEventListener("resize", function(){
    if (_rzT) cancelAnimationFrame(_rzT);
    _rzT = requestAnimationFrame(pickLayout);
  });

  /* ---------- progress drag ---------- */
  function seekToFrac(frac){
    frac = Math.max(0, Math.min(1, frac));
    var target = T_START + frac*(T_END - T_START);
    clock = target;
    prevIdx = -99; lastBeepR = -1;
    if (usingPlayer()){ try{ player.seekTo(target, true); }catch(err){} }
    update(clock);
    /* move thumb */
    if (elProgressThumb && elProgressTrack){
      var trackW = elProgressTrack.getBoundingClientRect().width;
      var px = frac * (trackW - 28) + 14;
      elProgressThumb.style.left = px.toFixed(1) + "px";
    }
  }
  function fracFromEvent(e){
    var rect = elProgressTrack.getBoundingClientRect();
    var px = (e.touches ? e.touches[0].clientX : e.clientX);
    return (px - rect.left) / rect.width;
  }
  var dragging = false;
  elProgressTrack.addEventListener("mousedown", function(e){
    dragging = true; elProgressTrack.classList.add("dragging");
    seekToFrac(fracFromEvent(e)); e.preventDefault();
  });
  document.addEventListener("mousemove", function(e){
    if (!dragging) return;
    seekToFrac(fracFromEvent(e));
  });
  document.addEventListener("mouseup", function(){
    if (dragging){ dragging = false; elProgressTrack.classList.remove("dragging"); }
  });
  elProgressTrack.addEventListener("touchstart", function(e){
    dragging = true; elProgressTrack.classList.add("dragging");
    seekToFrac(fracFromEvent(e)); e.preventDefault();
  }, {passive:false});
  document.addEventListener("touchmove", function(e){
    if (!dragging) return;
    seekToFrac(fracFromEvent(e)); e.preventDefault();
  }, {passive:false});
  document.addEventListener("touchend", function(){
    if (dragging){ dragging = false; elProgressTrack.classList.remove("dragging"); }
  });
  /* update thumb on normal playback */
  var _origUpdate = update;
  function updateThumb(t){
    if (dragging || !elProgressThumb || !elProgressTrack || T_END <= T_START) return;
    var frac = Math.max(0, Math.min(1, (t - T_START)/(T_END - T_START)));
    var trackW = elProgressTrack.getBoundingClientRect().width;
    if (trackW > 0){
      var px = frac * (trackW - 28) + 14;
      elProgressThumb.style.left = px.toFixed(1) + "px";
    }
  }

  /* ---------- settings drawer ---------- */
  var settingsBtn = document.getElementById("settingsBtn");
  var drawer = document.getElementById("drawer");
  var drawerBg = document.getElementById("drawerBg");
  var drawerClose = document.getElementById("drawerClose");
  var urlInput = document.getElementById("urlInput");
  var loadBtn = document.getElementById("loadBtn");
  var volRange = document.getElementById("volRange");
  var vlevel = document.getElementById("vlevel");
  var volDown = document.getElementById("volDown");
  var volUp = document.getElementById("volUp");
  var addNow = document.getElementById("addNow");
  var tlist = document.getElementById("tlist");
  var copyLink = document.getElementById("copyLink");
  var resetBtn = document.getElementById("resetBtn");

  function fmtMs(s){
    var neg = s<0; s = Math.abs(s);
    var m = Math.floor(s/60), rem = s - m*60;
    var w = Math.floor(rem), cs = Math.round((rem-w)*100);
    if (cs===100){ cs=0; w++; }
    return (neg?"-":"") + m + ":" + (w<10?"0":"") + w + "." + (cs<10?"0":"") + cs;
  }
  function renderTimers(){
    if (!tlist) return;
    tlist.innerHTML = "";
    TS.forEach(function(v, i){
      var isWork = (i%2===0);
      var row = document.createElement("div");
      row.className = "trow";
      row.innerHTML =
        '<span class="ti">'+(i+1)+'</span>'+
        '<span class="tt">'+fmtMs(v)+'</span>'+
        '<span class="tag '+(isWork?"work":"rest")+'">'+(isWork?"運動":"休息")+'</span>'+
        '<button class="del" aria-label="刪除">✕</button>';
      row.querySelector(".del").addEventListener("click", function(){
        TS.splice(i,1); rebuild(); syncURL(); saveConfig();
      });
      tlist.appendChild(row);
    });
  }
  function parseVideoId(s){
    s = (s||"").trim();
    if (!s) return "";
    var m = s.match(/(?:v=|\/embed\/|youtu\.be\/|\/shorts\/|\/v\/)([\w-]{11})/);
    if (m) return m[1];
    if (/^[\w-]{11}$/.test(s)) return s;
    return "";
  }
  function syncURL(){
    try{
      var u = new URL(location.href);
      u.searchParams.set("v", VIDEO);
      u.searchParams.set("t", TS.map(function(x){return Math.round(x*100)/100;}).join(","));
      history.replaceState(null, "", u.pathname + "?" + u.searchParams.toString());
    }catch(e){}
  }
  function saveConfig(){
    lsSet("yst-video", VIDEO);
    lsSet("yst-timers", JSON.stringify(TS));
    lsSet("yst-vol", String(level));
  }
  function loadVideo(id){
    if (!id) return;
    VIDEO = id;
    clock = 0; prevIdx = -99; lastBeepR = -1;
    started = false; setPlaying(false,false);
    startBtn.style.display = ""; startBtn.classList.remove("hidden");
    if (player && playerReady){ try{ player.cueVideoById(id); playerOk = true; }catch(e){} }
    var cv = document.getElementById("curVid"); if (cv) cv.textContent = VIDEO;
    saveConfig();
  }
  function setVolume(v){
    level = Math.max(0, Math.min(10, v|0));
    masterVol = level/10;
    if (volRange) volRange.value = level;
    if (vlevel) vlevel.textContent = level + " / 10";
    saveConfig();
  }
  /* ---------- drawers (settings right, library left) ---------- */
  var libDrawer = document.getElementById("libDrawer");
  var libBtn = document.getElementById("libraryBtn");
  var libClose = document.getElementById("libClose");
  var libList = document.getElementById("libList");
  var publishBtn = document.getElementById("publishBtn");
  var openEl = null;

  function openDrawer(el, side){
    if (openEl && openEl !== el){ openEl.style.transform = side==="left"?"translateX(-100%)":"translateX(100%)"; openEl.setAttribute("aria-hidden","true"); }
    openEl = el;
    el.setAttribute("aria-hidden","false");
    el.style.transform = "translateX(0)";
    drawerBg.hidden = false;
    requestAnimationFrame(function(){ drawerBg.style.opacity = "1"; });
  }
  function closeDrawer(){
    if (openEl){
      var left = openEl.classList.contains("left");
      openEl.style.transform = left ? "translateX(-100%)" : "translateX(100%)";
      openEl.setAttribute("aria-hidden","true");
      openEl = null;
    }
    drawerBg.style.opacity = "0";
    setTimeout(function(){ drawerBg.hidden = true; }, 280);
  }
  function openSettings(){
    urlInput.value = ""; urlInput.placeholder = "目前 ID：" + VIDEO;
    openDrawer(drawer, "right");
  }
  function openLibrary(){ renderLibrary(); openDrawer(libDrawer, "left"); }

  settingsBtn.addEventListener("click", openSettings);
  libBtn.addEventListener("click", openLibrary);
  drawerClose.addEventListener("click", closeDrawer);
  libClose.addEventListener("click", closeDrawer);
  drawerBg.addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function(e){ if (e.key==="Escape") closeDrawer(); });

  /* ---------- shared library ---------- */
  var SEED = [
    { id:"s-fullbody", title:"全身 HIIT · 完整版", author:"阿凱", video:DEFAULT_VIDEO, ts:DEFAULT_TS.slice(), thumb:true, hue:42 },
    { id:"s-tabata",   title:"Tabata 快速燃脂 · 4 輪", author:"Mia", video:DEFAULT_VIDEO, ts:tabata(8,20,10,8), hue:205 },
    { id:"s-core",     title:"核心腹肌 · 10 分鐘", author:"Leo", video:DEFAULT_VIDEO, ts:tabata(8,45,15,10), hue:152 },
    { id:"s-stretch",  title:"晨間伸展唤醒", author:"Nina", video:DEFAULT_VIDEO, ts:tabata(6,60,20,8), hue:92 }
  ];
  function tabata(rounds, work, rest, startAt){
    var arr = [], t = startAt||5;
    for (var i=0;i<rounds;i++){ t += work; arr.push(Math.round(t*100)/100); t += rest; arr.push(Math.round(t*100)/100); }
    return arr;
  }
  function statsOf(ts){
    var work = 0, dur = 0;
    if (ts.length>=2){ dur = ts[ts.length-1] - 0; work = Math.ceil((ts.length-1)/2); }
    return { work:work, dur:dur };
  }
  function fmtDur(s){ s=Math.round(s); var m=Math.floor(s/60), ss=s%60; return m+":"+(ss<10?"0":"")+ss; }
  var AV_COLORS = ["oklch(0.70 0.185 42)","oklch(0.74 0.115 205)","oklch(0.76 0.16 152)","oklch(0.84 0.155 92)","oklch(0.7 0.16 330)"];
  function avColor(name){ var h=0; for(var i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))%AV_COLORS.length; return AV_COLORS[h]; }

  function getShared(){ try{ return JSON.parse(ls("yst-shared")||"[]"); }catch(e){ return []; } }
  function setShared(a){ lsSet("yst-shared", JSON.stringify(a)); }

  function makeCard(item, opts){
    opts = opts || {};
    var st = statsOf(item.ts);
    var card = document.createElement("button");
    card.className = "card";
    if (item.video===VIDEO && JSON.stringify(item.ts)===JSON.stringify(TS)) card.classList.add("active");
    var av = avColor(item.author||"?");
    var thumbHTML = item.thumb
      ? '<img src="https://i.ytimg.com/vi/'+item.video+'/mqdefault.jpg" alt="" onerror="this.style.display=\'none\'">'
      : '';
    var subHTML = opts.sub
      ? '<span class="pill">'+opts.sub+'</span>'
      : '<span class="pill">運動 / 休息</span>';
    card.innerHTML =
      '<span class="thumb">'+
        '<span class="ph" style="background:linear-gradient(135deg, oklch(0.5 0.16 '+(item.hue||42)+'), oklch(0.42 0.13 '+((item.hue||42)+40)+'))">'+
          '<svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M4 9l2-2 9 9-2 2zM15 4l5 5-2 2-5-5z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'+
        '</span>'+ thumbHTML +
        '<span class="dur">'+fmtDur(st.dur)+'</span>'+
      '</span>'+
      '<span class="meta">'+
        '<span class="ttl">'+item.title+'</span>'+
        '<span class="by"><span class="av" style="background:'+av+'">'+(item.author||"?").slice(0,1)+'</span>'+(item.author||"匿名")+'</span>'+
        '<span class="stats"><span class="pill"><b>'+st.work+'</b> 組</span>'+subHTML+'</span>'+
      '</span>'+
      (opts.removable ? '<span class="del2" role="button" aria-label="刪除">✕</span>' : '');
    card.addEventListener("click", function(e){
      if (opts.removable && e.target.classList && e.target.classList.contains("del2")){
        e.stopPropagation();
        if (opts.onRemove) opts.onRemove(item);
        return;
      }
      loadTimerSet(item.video, item.ts, item);
    });
    return card;
  }
  function renderLibrary(){
    if (!libList) return;
    libList.innerHTML = "";
    SEED.forEach(function(it){ libList.appendChild(makeCard(it, {})); });
    getShared().forEach(function(it){
      libList.appendChild(makeCard(it, { removable:true, onRemove:function(item){
        setShared(getShared().filter(function(x){ return x.id!==item.id; }));
        renderLibrary();
      }}));
    });
  }

  /* ---------- history ---------- */
  var histDrawer = document.getElementById("histDrawer");
  var histBtn = document.getElementById("historyBtn");
  var histClose = document.getElementById("histClose");
  var histList = document.getElementById("histList");
  var clearHistBtn = document.getElementById("clearHistBtn");

  function getHistory(){ try{ return JSON.parse(ls("yst-history")||"[]"); }catch(e){ return []; } }
  function setHistory(a){ lsSet("yst-history", JSON.stringify(a)); }
  function timeAgo(ms){
    var d = Date.now()-ms, s=Math.floor(d/1000);
    if (s<60) return "剛剛看過";
    var m=Math.floor(s/60); if (m<60) return m+" 分鐘前";
    var h=Math.floor(m/60); if (h<24) return h+" 小時前";
    var dd=Math.floor(h/24); if (dd<7) return dd+" 天前";
    var dt=new Date(ms); return (dt.getMonth()+1)+"/"+dt.getDate();
  }
  function recordHistory(meta){
    if (!meta || !meta.ts || meta.ts.length<2) return;
    var key = (meta.video||"")+"|"+JSON.stringify(meta.ts);
    var h = getHistory().filter(function(x){ return ((x.video||"")+"|"+JSON.stringify(x.ts))!==key; });
    var st = statsOf(meta.ts);
    h.unshift({
      video: meta.video, ts: meta.ts.slice(),
      title: meta.title || ("自訂訓練 · "+st.work+" 組 "+fmtDur(st.dur)),
      author: meta.author || "自訂",
      hue: meta.hue || 42, thumb: meta.thumb!==false,
      viewedAt: Date.now()
    });
    if (h.length>24) h = h.slice(0,24);
    setHistory(h);
  }
  function renderHistory(){
    if (!histList) return;
    histList.innerHTML = "";
    var h = getHistory();
    if (!h.length){
      var em = document.createElement("div"); em.className="lib-empty";
      em.textContent="還沒有紀錄。載入任一計時後就會出現在這裡。";
      histList.appendChild(em); return;
    }
    h.forEach(function(it){
      histList.appendChild(makeCard(it, { removable:true, sub:timeAgo(it.viewedAt), onRemove:function(item){
        setHistory(getHistory().filter(function(x){ return x.viewedAt!==item.viewedAt; }));
        renderHistory();
      }}));
    });
  }
  function openHistory(){ renderHistory(); openDrawer(histDrawer, "left"); }
  histBtn.addEventListener("click", openHistory);
  histClose.addEventListener("click", closeDrawer);
  clearHistBtn.addEventListener("click", function(){
    setHistory([]); renderHistory();
  });
  function findMeta(video, ts){
    var key = (video||"")+"|"+JSON.stringify(ts);
    var all = SEED.concat(getShared());
    for (var i=0;i<all.length;i++){ if (((all[i].video||"")+"|"+JSON.stringify(all[i].ts))===key) return all[i]; }
    return null;
  }
  function loadTimerSet(video, ts, meta){
    TS = ts.slice();
    if (video && video!==VIDEO){ loadVideo(video); }
    else { clock = 0; started=false; setPlaying(false,false); startBtn.style.display=""; startBtn.classList.remove("hidden"); }
    rebuild(); syncURL(); saveConfig();
    recordHistory(meta || {video:video, ts:ts});
    closeDrawer();
  }
  publishBtn.addEventListener("click", function(){
    var mine = getShared();
    var st = statsOf(TS);
    mine.unshift({ id:"u-"+Date.now(), title:"我的訓練 · "+st.work+" 組 "+fmtDur(st.dur), author:"你", video:VIDEO, ts:TS.slice(), thumb:true, hue:42 });
    setShared(mine); renderLibrary();
    var o = publishBtn.textContent; publishBtn.textContent="已加入清單 ✓"; setTimeout(function(){ publishBtn.textContent=o; }, 1400);
  });

  loadBtn.addEventListener("click", function(){
    var id = parseVideoId(urlInput.value);
    if (id){ loadVideo(id); syncURL(); recordHistory(findMeta(id, TS) || {video:id, ts:TS}); urlInput.value=""; urlInput.placeholder="目前 ID："+VIDEO; }
    else { urlInput.value=""; urlInput.placeholder="連結無效，請再試一次"; }
  });
  urlInput.addEventListener("keydown", function(e){ if (e.key==="Enter"){ e.preventDefault(); loadBtn.click(); } });

  volRange.addEventListener("input", function(){ setVolume(parseInt(volRange.value,10)); });
  volRange.addEventListener("change", function(){ ensureAudio(); tone(880,0.1,0,"square",0.16); });
  volDown.addEventListener("click", function(){ setVolume(level-1); ensureAudio(); tone(880,0.1,0,"square",0.16); });
  volUp.addEventListener("click", function(){ setVolume(level+1); ensureAudio(); tone(880,0.1,0,"square",0.16); });

  addNow.addEventListener("click", function(){
    var t = Math.round(Math.max(0, clock)*100)/100;
    TS.push(t); rebuild(); syncURL(); saveConfig();
  });
  copyLink.addEventListener("click", function(){
    syncURL();
    var orig = copyLink.textContent;
    var done = function(){ copyLink.textContent = "已複製連結 ✓"; setTimeout(function(){ copyLink.textContent = orig; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(location.href).then(done, done); }
    else { done(); }
  });
  resetBtn.addEventListener("click", function(){
    TS = DEFAULT_TS.slice();
    setVolume(6);
    loadVideo(DEFAULT_VIDEO);
    rebuild(); syncURL(); saveConfig();
  });

  /* ---------- restore + init ---------- */
  (function restore(){
    try{
      var bp = ls("yst-beep");
      if (bp === "0"){ beepOn=false; beepBtn.setAttribute("data-on","false"); }
    }catch(e){}

    if (volRange) volRange.value = level;
    if (vlevel) vlevel.textContent = level + " / 10";

    rebuild();

    var tt = parseFloat(ls("yst-time"));
    if (!isNaN(tt) && tt > 1 && tt < T_END){ restoreTime = tt; clock = tt; }

    document.documentElement.style.setProperty("--phase", PH_LIT.ready);
    update(clock);
    recordHistory(findMeta(VIDEO, TS) || {video:VIDEO, ts:TS});
  })();

})();
</script>
</body>
</html>
